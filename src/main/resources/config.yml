# Permission node that the player must have to reload the configuration (/welcomer reload)
PermissionReload: "welcomer.reload"

# Permission node that the player must have to configure the plugin from in-game through the gui (/welcomer menu)
permissionMenu: "welcomer.menu"

# Message of the day
MOTD:

  # Whether the MOTD feature is enabled or not
  enabled: true

  # The message that should be sent to the player when they join the server
  message:
    - "&7-=-=-=-=-=-=-=-=-=-"
    - "&aWelcome to &2{ServerName}"
    - "&aOnline players: &2{OnlinePlayers}/{MaxPlayers}"
    - "&aDiscord: &2{Discord}"
    - "&aStore: &2{Store}"
    - "&7-=-=-=-=-=-=-=-=-=-"

# Join/Quit messages
JoinWelcomer:

  # Whether the join/quit messages feature should be enabled
  enabled: true

  # The message that should be sent when a player joins the server for the first time
  First-Join-Message: "&aWelcome &2{Player} &afor joining &2{ServerName} &afor the first time ever."

  # The message that should be sent when a player joins the server
  Join-Message: "&aWelcome back to &2{ServerIP}:{ServerPort} &2{PlayerName}"

  # The message that should be sent when a player leaves the server
  Quit-Message: "&c{PlayerName} has left the server. :("

# This welcomes players with a title message.
TitleWelcomer:

  # Whether the Title welcome feature should be enabled
  enabled: true

  # The title of the title message
  Title: "&aWelcome to &2&n{ServerName}"

  # The subtitle of the title message
  SubTitle: "&a{PlayerDisplayName}"

  # The time that the title should fade in for in ticks. Default: 20
  FadeIn: 20

  # The time that the title should stay on the plauers screen in ticks. Default: 60
  Stay: 60

  # The time that the title should fade out for in ticks. Default: 20
  FadeOut: 20

ActionBarWelcome:

  # Whether the ActionBar welcome feature should be enabled
  enabled: true

  # The message that should be sent to the player through the action bar.
  message: "&aWelcome to &2{ServerName} &a{PlayerDisplayName}"

  # The sound that should be played when the action bar message is sent
  sound:

    # Whether the sound should be enabled
    enabled: true

    # The sound that should be played | https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Sound.html
    sound: ENTITY_EXPERIENCE_ORB_PICKUP

    # The volume of the sound
    volume: 1.0

    # The pitch of the sound
    pitch: 1.0

# The GUI that the player will see when they run /welcomer menu
GUI:

  # Whether the GUI feature should be enabled
  enabled: true